[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# Versions below are pinned to releases built against Kotlin <= 2.2 so the project's
# Kotlin 2.2.10 compiler is not upgraded (guidelines 5.19).
navigation3 = "1.2.0"
datastore = "1.2.1"
koin = "4.1.1"
ktor = "3.3.3"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
composeMultiplatform = "1.9.3"
slf4j = "2.0.17"
sqldelight = "2.1.0"
zxing = "3.5.4"
camerax = "1.6.2"
mlkitBarcode = "17.3.0"
# 3.72 is the newest jediterm built against Kotlin 2.1 (3.73+ need Kotlin 2.4).
jediterm = "3.72"
pty4j = "0.13.13"
# jline 4 needs Java 22; 3.30 runs on the Java 17 target.
jline = "3.30.17"
jna = "5.14.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
